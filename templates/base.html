<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}أثَر | المنصة الرقمية لتوثيق وتقييم المشاريع الأكاديمية{% endblock %}</title>

    <!-- خط IBM Plex Sans Arabic للأصالة الهندسية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS للتنظيم البنيوي المخصص -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#040810',
                        glassBg: 'rgba(8, 18, 33, 0.72)',
                        borderCrystal: 'rgba(0, 217, 255, 0.16)',
                        cyanNeon: '#00D9FF',
                        goldMark: '#D8B46A',
                        textBright: '#F0F5FA',
                        textMuted: '#76879D',
                    },
                    fontFamily: {
                        sans: ['"IBM Plex Sans Arabic"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #040810;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 217, 255, 0.09) 0%, transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(7, 17, 31, 0.85) 0%, transparent 50%);
            color: #F0F5FA;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(8, 18, 33, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 217, 255, 0.16);
        }

        .glass-card {
            background: rgba(10, 22, 40, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 217, 255, 0.14);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .glass-card:hover {
            border-color: rgba(0, 217, 255, 0.45);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.12);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #040810;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 217, 255, 0.25);
            border-radius: 3px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden antialiased selection:bg-cyanNeon selection:text-void">

    <!-- شريط التنقل الجانبي الأيقوني المستوحى من الصورة (2) -->
    <aside class="w-full md:w-20 glass-panel md:border-l border-b md:border-b-0 border-borderCrystal flex md:flex-col items-center justify-between p-4 md:py-6 z-30 shrink-0">
        <!-- الشعار الأكاديمي المذهب -->
        <a href="{% url 'projects:gallery' %}" class="flex flex-col items-center group">
            <span class="text-xl font-bold tracking-wider text-goldMark">أثَر</span>
            <span class="text-[9px] tracking-widest text-textMuted uppercase mt-[-3px]">ATHAR</span>
        </a>

        <!-- الروابط الأساسية -->
        <nav class="flex md:flex-col gap-4 md:gap-6">
            <a href="{% url 'projects:gallery' %}" class="p-2.5 rounded-xl text-cyanNeon bg-cyanNeon/10 border border-cyanNeon/30 transition-colors" title="معرض المشاريع">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
            </a>
            <a href="/admin/" class="p-2.5 rounded-xl text-textMuted hover:text-textBright hover:bg-white/5 transition-colors" title="لوحة التحكم والتحكيم">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </a>
        </nav>

        <!-- بروفايل المستخدم / حالة الجلسة -->
        <div class="flex items-center">
            <div class="w-8 h-8 rounded-full border border-borderCrystal overflow-hidden bg-void flex items-center justify-center text-xs font-semibold text-textBright">
                {% if user.is_authenticated %}
                    {{ user.username|slice:":1"|upper }}
                {% else %}
                    <a href="/admin/" class="text-textMuted hover:text-cyanNeon" title="تسجيل الدخول">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </a>
                {% endif %}
            </div>
        </div>
    </aside>

    <!-- المساحة العامة للتطبيقات والمحتوى -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        
        <!-- الشريط العلوي للبحث الموحد -->
        <header class="h-16 px-6 md:px-10 flex items-center justify-between border-b border-borderCrystal/50 shrink-0">
            <form method="GET" action="{% url 'projects:gallery' %}" class="w-full max-w-md relative">
                <input type="text" 
                       name="q" 
                       value="{{ search_query }}"
                       placeholder="ابحث عن عنوان مشروع، تقنية، أو طالب..." 
                       class="w-full glass-panel text-sm py-2 px-4 pr-10 rounded-full text-textBright placeholder-textMuted focus:outline-none focus:border-cyanNeon transition-all">
                <button type="submit" class="absolute right-3.5 top-2.5 text-textMuted hover:text-cyanNeon">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </button>
            </form>

            <div class="hidden sm:flex items-center gap-3 text-xs text-textMuted">
                <span class="inline-block w-2 h-2 rounded-full bg-cyanNeon animate-pulse"></span>
                <span>المستودع الأكاديمي الرقمي</span>
            </div>
        </header>

        <!-- منطقة حقن المحتوى القابلة للتمرير -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
